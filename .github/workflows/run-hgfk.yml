name: 每月25号8点自动运行

on:
  schedule:
    - cron: '0 0 25 * *'  # 北京时间每月25号8点
  workflow_dispatch:

jobs:
  run-script:
    runs-on: windows-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 安装官方32位Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'
          architecture: 'x86'

      - name: 安装所有第三方依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests Pillow numpy opencv-python
        shell: pwsh

      - name: 运行脚本（添加依赖路径）
        run: |
          # 1. 把仓库里的DLLs目录加入系统PATH，确保能找到ubpa依赖的DLL
          $env:PATH = "$(Get-Location)\DLLs;$env:PATH"
          # 2. 把仓库里的Lib目录加入Python路径，确保能找到ubpa模块
          python -c "import sys; sys.path.append('.\\Lib'); import hgfk"
        shell: pwsh
