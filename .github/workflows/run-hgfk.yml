name: 每月28号14点运行 hgfk.py
on:
  schedule:
    - cron: '0 6 28 * *'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: windows-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 配置32位Python 3.10环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          architecture: 'x86'

      - name: 安装所有依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow numpy opencv-python

      - name: 执行脚本（隔离旧Lib，仅用上传的ubpa）
        run: |
          # 仅指向你上传的ubpa模块路径，不碰旧Lib
          $env:PYTHONPATH = "$env:PYTHONPATH;$pwd\hgfk\new_ubpa"
          # 把DLL目录加入系统PATH
          $env:PATH = "$env:PATH;$pwd\hgfk\new_ubpa\DLLs"
          python hgfk.py
