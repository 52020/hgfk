name: 每月28号14点运行 hgfk.py

on:
  schedule:
    - cron: '0 6 28 * *'  # UTC 6点 = 北京时间14点，每月28号执行
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: 安装所有依赖
        run: |
          python -m pip install --upgrade pip
          # 安装脚本需要的所有第三方库
          pip install requests pillow numpy opencv-python
          # 将仓库根目录添加到Python搜索路径
          echo "PYTHONPATH=$(pwd)" >> $GITHUB_ENV

      - name: 执行hgfk.py
        run: python hgfk.py
