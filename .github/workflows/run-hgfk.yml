name: 运行 hgfk.py 脚本

on:
  # 定时触发（每月28号14点北京时间，对应UTC时间6点）
  schedule:
    - cron: '0 6 28 * *'
  
  # 手动触发（必须添加这一项）
  workflow_dispatch:
    # 可选：添加输入参数
    inputs:
      log-level:
        description: '日志级别'
        required: false
        default: 'info'

jobs:
  run-script:
    runs-on: ubuntu-latest
    
    steps:
      - name: 检查工作流文件
        run: |
          echo "工作流文件内容:"
          cat .github/workflows/run-hgfk.yml
          
      - name: 拉取仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow numpy opencv-python

      - name: 调试 - 查看项目结构
        run: |
          echo "=== 项目结构 ==="
          find . -type f -name "*.py" | head -20
          echo "=== ubpa目录 ==="
          find . -name "ubpa" -type d
          ls -la Lib/ubpa/ 2>/dev/null || echo "Lib/ubpa不存在"
          
      - name: 修复导入问题
        run: |
          # 检查ubpa是否为有效的Python包
          if [ -d "Lib/ubpa" ]; then
            echo "创建__init__.py文件"
            find Lib/ubpa -type d -exec touch {}/__init__.py \;
          fi
          
      - name: 执行hgfk.py
        run: |
          # 方法1：直接运行，看看错误
          echo "=== 直接运行 ==="
          python hgfk.py 2>&1 || true
          
          # 方法2：调试导入
          echo "=== 调试导入 ==="
          python -c "
import sys
print('Python路径:', sys.version)
print('系统路径:')
for p in sys.path:
    print('  ', p)
print()
try:
    sys.path.insert(0, '.')
    from ubpa.encrypt import decrypt
    print('导入成功')
except Exception as e:
    print(f'导入失败: {e}')
          "
