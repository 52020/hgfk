name: 每月25号8点自动运行

on:
  schedule:
    - cron: '0 0 25 * *'  # UTC 0点 = 北京时间8点
  workflow_dispatch:

jobs:
  run-script:
    runs-on: windows-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 安装官方64位Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'
          architecture: 'x64'

      - name: 安装所有第三方依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests Pillow numpy opencv-python
        shell: pwsh

      - name: 运行脚本
        run: |
          # 直接运行主脚本，无需再处理ubpa的DLL和路径
          python hgfk.py
        shell: pwsh
