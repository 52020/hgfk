name: 每月28号14点运行 hgfk.py
on:
  schedule:
    - cron: '0 6 28 * *'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 配置 Python 3.13 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 安装所有依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow numpy opencv-python

      - name: 执行脚本（终极绕过所有导入问题）
        run: |
          # 1. 把encrypt.py的内容复制到临时目录
          mkdir -p /tmp/ubpa
          cp $(pwd)/Lib/ubpa/encrypt.py /tmp/ubpa/
          touch /tmp/ubpa/__init__.py
          
          # 2. 运行脚本，优先加载临时目录的ubpa包
          PYTHONPATH=/tmp:$PYTHONPATH python hgfk.py
