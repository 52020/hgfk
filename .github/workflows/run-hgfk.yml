name: 每月28号14点运行 hgfk.py
on:
  schedule:
    - cron: '0 6 28 * *'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: windows-latest  # ✅ Windows 环境
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 配置 Python 3.13 环境  # ✅ Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'
          architecture: 'x86'

      - name: 安装所有依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow numpy opencv-python

      - name: 执行脚本（Windows环境）
        run: |
          # Windows PowerShell语法
          # 设置PYTHONPATH为当前目录，这样from ubpa.encrypt会正确解析
          $env:PYTHONPATH = "$pwd\Lib"
          python hgfk.py
