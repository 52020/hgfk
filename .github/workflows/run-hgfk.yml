jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 配置 Python 3.13 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 安装依赖 + 临时修复ubpa包结构
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow numpy opencv-python
          
      - name: 调试 - 查看ubpa目录结构
        run: |
          echo "=== 查看Lib/ubpa目录结构 ==="
          ls -la Lib/ubpa/
          echo "=== 递归查找encrypt.py ==="
          find Lib/ -name "*encrypt*" -type f

      - name: 执行hgfk.py
        run: |
          # 尝试不同的方法
          echo "=== 方法1: 使用sys.path修改 ==="
          cat > test_import.py << 'EOF'
import sys
sys.path.insert(0, 'Lib')
try:
    from ubpa.encrypt import decrypt
    print("导入成功")
except ImportError as e:
    print(f"导入失败: {e}")
EOF
          python test_import.py
          
          echo "=== 方法2: 直接运行hgfk.py ==="
          # 创建__init__.py确保ubpa是包
          find Lib/ubpa -type d -exec touch {}/__init__.py \;
          python -c "import sys; sys.path.insert(0, 'Lib'); exec(open('hgfk.py').read())"
